server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: JavaInternship
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:development-jwt-secret-at-least-256-bits-long-for-hs256-algorithm-secure-key}
  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

app:
  cards:
    max-per-user: 5

user:
  gateway:
    internal-secret: ${GATEWAY_INTERNAL_SECRET:local-dev-gateway-internal-secret}